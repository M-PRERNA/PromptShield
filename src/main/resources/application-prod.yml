spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:h2:file:${PROMPTSHIELD_DB_PATH:/tmp/data/safeprompt-db};AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  thymeleaf:
    cache: true

server:
  port: ${PORT:8080}
