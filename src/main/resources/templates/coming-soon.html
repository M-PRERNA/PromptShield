<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>
<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <div class="main-wrapper">
        <header th:replace="~{fragments/app-bar :: appBar}"></header>
        <main class="main-content" id="main-content">
            <section class="card coming-soon">
                <h2 class="section-title" th:text="${featureName} + ' — Coming Soon'">Coming Soon</h2>
                <p class="text-muted">This area is planned for a future release of PromptShield.</p>
                <p style="margin-top: 24px;"><a class="btn btn-primary" th:href="@{/}">Return to Dashboard</a></p>
            </section>
        </main>
    </div>
</div>
<script th:src="@{/layout.js}" defer></script>
</body>
</html>
